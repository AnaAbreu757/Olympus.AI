<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Olympus AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="mark login-mark">O</div>
    <h1>Olympus</h1>
    <p>Entra para continuares a mesma conversa em qualquer dispositivo.</p>
    <button id="login-btn" class="login-btn">Entrar com Google</button>
  </div>
</div>

<div class="app" id="app" hidden>

  <aside class="rail">
    <div class="rail-top">
      <div class="mark">O</div>
    </div>

    <nav class="rail-nav">
      <button class="rail-item active" data-view="chat" title="Chat">
        <span class="rail-dot"></span>
        <span class="rail-label">Chat</span>
      </button>
      <button class="rail-item" data-view="code" title="Codigo">
        <span class="rail-dot"></span>
        <span class="rail-label">Codigo</span>
      </button>
      <button class="rail-item" data-view="gallery" title="Imagens">
        <span class="rail-dot"></span>
        <span class="rail-label">Imagens</span>
      </button>
    </nav>

    <div class="rail-bottom">
      <div class="status">
        <span class="status-pulse"></span>
        <span>Ligado</span>
      </div>
      <button id="logout-btn" class="logout-btn" title="Sair">X</button>
    </div>
  </aside>

  <main class="view view-chat active">

    <header class="topbar">
      <div class="topbar-title">
        <h1>Olympus</h1>
        <p>o teu conselho de deuses, num so lugar</p>
      </div>

      <div class="pantheon">
        <button class="pantheon-chip active" data-provider="openai">GPT</button>
        <button class="pantheon-chip" data-provider="anthropic">Claude</button>
        <button class="pantheon-chip" data-provider="google">Gemini</button>
      </div>
    </header>

    <section class="thread" id="thread">
      <div class="empty-state">
        <div class="empty-glyph">O</div>
        <p>Escolhe um modelo acima e escreve a tua primeira mensagem.</p>
      </div>
    </section>

    <form class="composer" id="composer">
      <textarea id="input" placeholder="Pergunta ao Olympus..." rows="1"></textarea>
      <button type="submit" id="send-btn" aria-label="Enviar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </main>

  <main class="view view-code">
    <div class="code-panel">
      <div class="code-header">
        <h2>&gt;_ Painel de Codigo</h2>
        <div class="code-tabs">
          <button class="code-tab active" data-lang="javascript">JavaScript</button>
          <button class="code-tab" data-lang="python">Python</button>
          <button class="code-tab" data-lang="html">HTML</button>
        </div>
      </div>

      <div class="code-editor">
        <textarea id="code-input" class="editor-input" placeholder="Escreve ou cola codigo aqui..."></textarea>
        <div class="code-controls">
          <button id="run-code-btn" class="code-btn">Executar</button>
          <button id="clear-code-btn" class="code-btn secondary">Limpar</button>
          <button id="ask-claude-code-btn" class="code-btn secondary">Explicar</button>
        </div>
      </div>

      <div id="code-output" class="code-output">Resultado aqui...</div>
    </div>
  </main>

  <main class="view view-gallery">
    <div class="gallery-panel">
      <div class="gallery-header">
        <h2>* Galeria</h2>
      </div>

      <div class="prompt-input-group">
        <textarea id="image-prompt" placeholder="Descreve a imagem que queres gerar..."></textarea>
        <button id="generate-image-btn" class="generate-btn">Gerar</button>
      </div>

      <div id="gallery-grid" class="gallery-grid">
        <div class="empty-gallery">
          <div class="empty-gallery-icon">*</div>
          <p>Nenhuma imagem ainda.</p>
        </div>
      </div>
    </div>
  </main>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
